<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Demo</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>

  <div class="container mt-4">

    <div class="bg-primary text-white p-4 rounded">
      <h1 class="display-4">Welcome to My Bootstrap Page</h1>
      <p class="lead">This page demonstrates my extreme autism lol :D</p>
    </div>

    <div class="alert alert-success mt-3">
      <strong>Success!</strong> I'm a genius
    </div>

    <div class="row mt-4">
      <div class="col-md-4">
        <div class="bg-light p-3 border rounded">
          <h3>Column 1</h3>
          <p>This is the first column</p>
          <button class="btn btn-success">Click</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="bg-light p-3 border rounded">
          <h3>Column 2</h3>
          <p>This is the third column.</p>
          <button class="btn btn-primary">Click</button>
        </div>
      </div>

      <div class="col-md-4">
        <div class="bg-light p-3 border rounded">
          <h3>Column 3</h3>
          <p>No wait, this is the third column.</p>
          <button class="btn btn-danger">Click</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
